version: '3.8'

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: aliun-omniroute-gateway
    restart: always
    ports:
      - "20128:20128"
    environment:
      - NODE_ENV=production
      - PORT=20128
      - HOST=0.0.0.0
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-aliun-secret-gateway-2026}
      # Proveedores primarios
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Configuración de compresión y resiliencia
      - ENABLE_RTK_COMPRESSION=true
      - ENABLE_CIRCUIT_BREAKER=true
      - CIRCUIT_BREAKER_RESET_TIME=30
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aliun-network

networks:
  aliun-network:
    driver: bridge
